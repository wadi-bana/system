<!-- LOGIN MODAL (USERNAME + PASSWORD + ANONYMOUS AUTH) -->
<div class="modal-overlay" id="loginOverlay">
  <div class="modal-card" style="max-width: 400px;">
    <div class="text-center mb-4">
      <img src="assets/images/wadi-bina-logo.jpeg" alt="شعار شركة وادي بناء"
        class="w-20 h-20 object-contain rounded-xl mx-auto border-2 border-gold shadow-lg mb-2">
      <h2 id="lgTitle" class="text-xl font-black text-gold">تسجيل الدخول للنظام الموحد</h2>
      <p id="lgSub" class="text-zinc-400 text-xs mt-1">أدخل اسم المستخدم وكلمة المرور للوصول للوحة التحكم</p>
      <p id="cloudInitError" class="hidden text-red-400 text-xs mt-2" role="alert"></p>
    </div>
    <form onsubmit="handleLogin(event)">
      <div class="mb-4">
        <label id="lgUserLbl" class="block text-xs font-bold text-zinc-300 mb-2">اسم المستخدم</label>
        <input type="text" id="loginUser" autocomplete="username"
          class="w-full bg-darkbg border border-zinc-700 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none"
          required placeholder="مثال: waleed أو yusef">
      </div>
      <div class="mb-6">
        <label id="lgPassLbl" class="block text-xs font-bold text-zinc-300 mb-2">كلمة المرور</label>
        <input type="password" id="loginPass"
          class="w-full bg-darkbg border border-zinc-700 rounded-xl px-4 py-3 text-sm text-zinc-100 outline-none"
          required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" id="lgBtn"
        class="w-full gold-gradient-bg text-black font-extrabold py-3 rounded-xl shadow-lg transition">دخول النظام</button>
    </form>
  </div>
</div>
